name: brain-image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/brain-image.yml"
      - "Dockerfile.brain"
      - "cmd/brain/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read
  packages: write

env:
  BRAIN_IMAGE: ghcr.io/massivemoose/ovek-brain

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Brain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.brain
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BRAIN_IMAGE }}:${{ github.sha }}
            ${{ env.BRAIN_IMAGE }}:main
