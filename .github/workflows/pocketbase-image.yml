name: pocketbase-image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pocketbase-image.yml"
      - "Dockerfile.pocketbase"

permissions:
  contents: read
  packages: write

env:
  POCKETBASE_IMAGE: ghcr.io/massivemoose/ovek-pocketbase
  POCKETBASE_VERSION: 0.38.1

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish PocketBase image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.pocketbase
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PB_VERSION=${{ env.POCKETBASE_VERSION }}
          tags: |
            ${{ env.POCKETBASE_IMAGE }}:v${{ env.POCKETBASE_VERSION }}
            ${{ env.POCKETBASE_IMAGE }}:v${{ env.POCKETBASE_VERSION }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/massivemoose/ovek
            org.opencontainers.image.version=v${{ env.POCKETBASE_VERSION }}
