services:
  # --- Edge router for the control plane and deployed apps ---
  traefik:
    image: traefik:v3.6
    container_name: traefik
    environment:
      - DOCKER_API_VERSION=1.52
    command:
      - "--log.level=INFO"
      - "--api.insecure=true" # Dashboard at :8080 (Turn off in production!)
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=alces-net"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080" # Traefik Dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - alces-net

  # --- Alces control plane ---
  brain:
    build:
      context: .
      dockerfile: Dockerfile.brain
    environment:
      - BRAIN_API_KEY=dev-brain-key
      - BUILDKIT_HOST=docker-container://buildkit
      - BUILD_REGISTRY_PUBLISH_HOST=host.docker.internal:5001
      - RUNTIME_REGISTRY_HOST=localhost:5001
      - REGISTRY_API_BASE_URL=http://registry:5000
      - REGISTRY_INSECURE=true
      - PROJECTS_HOST_DATA_DIR=${PWD}/brain_data/projects
      - POCKETBASE_IMAGE=elestio/pocketbase:latest
    depends_on:
      - buildkitd
      - registry
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./brain_data:/var/lib/alces"
      - "${PWD}/brain_data/projects:${PWD}/brain_data/projects"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.brain.entrypoints=web"
      - "traefik.http.routers.brain.service=brain"
      - "traefik.http.routers.brain.rule=Host(`brain.localhost`)"
      - "traefik.http.services.brain.loadbalancer.server.port=8081"
      - "traefik.docker.network=alces-net"
    networks:
      - alces-net

  # --- Internal image builder for Railpack ---
  buildkitd:
    container_name: buildkit
    image: moby/buildkit:v0.28.1
    privileged: true
    networks:
      - alces-net

  registry:
    image: registry:2
    container_name: registry
    environment:
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    ports:
      - "5001:5000"
    networks:
      - alces-net

networks:
  alces-net:
    external: false
    name: alces-net
