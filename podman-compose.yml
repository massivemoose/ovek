services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    command:
      - "--log.level=INFO"
      - "--api.insecure=true"
      - "--providers.file.directory=/var/lib/ovek/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "./brain_data/traefik:/var/lib/ovek/traefik:ro,z"
    networks:
      - ovek-net

  brain:
    build:
      context: .
      dockerfile: Dockerfile.brain
    security_opt:
      - "label=disable"
    environment:
      - BRAIN_API_KEY=dev-brain-key
      - RUNTIME_ENGINE=podman
      - RUNTIME_HOST=${RUNTIME_HOST:-unix:///run/podman/podman.sock}
      - BUILDKIT_HOST=${BUILDKIT_HOST:-tcp://buildkitd:1234}
      - BUILD_REGISTRY_PUBLISH_HOST=${BUILD_REGISTRY_PUBLISH_HOST:-registry:5000}
      - RUNTIME_REGISTRY_HOST=${RUNTIME_REGISTRY_HOST:-localhost:5001}
      - REGISTRY_API_BASE_URL=${REGISTRY_API_BASE_URL:-http://registry:5000}
      - REGISTRY_INSECURE=true
      - PROJECTS_HOST_DATA_DIR=${PWD}/brain_data/projects
      - POCKETBASE_IMAGE=elestio/pocketbase:latest
      - TRAEFIK_DYNAMIC_CONFIG_DIR=/var/lib/ovek/traefik/dynamic
      - TRAEFIK_BRAIN_SERVICE_URL=http://brain:8081
    depends_on:
      - buildkitd
      - registry
    volumes:
      - "/run/podman/podman.sock:/run/podman/podman.sock"
      - "./brain_data:/var/lib/ovek:z"
      - "${PWD}/brain_data/projects:${PWD}/brain_data/projects:z"
      - "./brain_data/traefik:/var/lib/ovek/traefik:z"
    networks:
      - ovek-net

  buildkitd:
    container_name: buildkit
    image: moby/buildkit:v0.28.1
    command:
      - "--addr=tcp://0.0.0.0:1234"
    privileged: true
    networks:
      - ovek-net

  registry:
    image: registry:2
    container_name: registry
    environment:
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    ports:
      - "5001:5000"
    networks:
      - ovek-net

networks:
  ovek-net:
    external: false
    name: ovek-net
