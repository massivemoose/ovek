services:
  traefik:
    image: docker.io/library/traefik:v3.6
    container_name: traefik
    command:
      - "--log.level=INFO"
      - "--api.insecure=true"
      - "--providers.file.directory=/var/lib/ovek/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "./brain_data/traefik:/var/lib/ovek/traefik:ro,z"
    networks:
      - ovek-net

  brain:
    build:
      context: .
      dockerfile: Dockerfile.brain
    security_opt:
      - "label=disable"
    environment:
      - OVEK_AUTH_MODE=${OVEK_AUTH_MODE:-dev}
      - BRAIN_API_KEY=${BRAIN_API_KEY:-dev-brain-key}
      - OVEK_SECRETS_KEY=${OVEK_SECRETS_KEY:-}
      - RUNTIME_ENGINE=${RUNTIME_ENGINE:-podman}
      - RUNTIME_HOST=${RUNTIME_HOST:-unix:///run/podman/podman.sock}
      - PROJECTS_HOST_DATA_DIR=${PWD}/brain_data/projects
      - POCKETBASE_IMAGE=${POCKETBASE_IMAGE:-ghcr.io/massivemoose/ovek-pocketbase:v0.38.1}
      - TRAEFIK_DYNAMIC_CONFIG_DIR=/var/lib/ovek/traefik/dynamic
      - TRAEFIK_BRAIN_SERVICE_URL=http://brain:8081
    volumes:
      - "/run/podman/podman.sock:/run/podman/podman.sock"
      - "./brain_data:/var/lib/ovek:z"
      - "${PWD}/brain_data/projects:${PWD}/brain_data/projects:z"
      - "./brain_data/traefik:/var/lib/ovek/traefik:z"
    networks:
      - ovek-net

networks:
  ovek-net:
    external: false
    name: ovek-net
